<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Matriks Login</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body class="login-page">
    <div class="container login-container">
      <div class="card login-card">
        <div class="card-body">
          <!-- Logo -->

          <div class="text-center mb-4">
            <img
              src="../assets/images/matriks-logo.png"
              class="login-logo"
              alt="Matriks"
            />
          </div>

          <h3 class="text-center mb-4">Giriş Yap</h3>

          <form id="loginForm" class="needs-validation" novalidate>
            <!-- Kullanıcı Adı -->

            <div class="mb-3">
              <label for="username" class="form-label">
                <i class="fa-solid fa-user me-2"></i>
                Kullanıcı Adı
              </label>

              <input type="text" class="form-control" id="username" required />

              <div class="invalid-feedback">Kullanıcı adı zorunludur.</div>
            </div>

            <!-- Şifre -->

            <div class="mb-3">
              <label for="password" class="form-label">
                <i class="fa-solid fa-lock me-2"></i>
                Şifre
              </label>

              <div class="input-group">
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  required
                />

                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  id="togglePassword"
                >
                  <i class="fa-solid fa-eye-slash"></i>
                </button>
              </div>

              <div class="invalid-feedback">Şifre zorunludur.</div>
            </div>

            <!-- Şifremi Unuttum -->

            <div class="text-end mb-4">
              <a href="forgot-password.html" class="forgot-password"> Şifremi Unuttum </a>
            </div>

            <!-- Buton -->

            <button type="submit" class="btn login-btn w-100">
              <i class="fa-solid fa-right-to-bracket me-2 fs-5"></i>

              Giriş Yap
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/login.js"></script>
  </body>
</html>
