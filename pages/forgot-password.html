<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Şifremi Unuttum</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body class="login-page">
    <div class="container login-container">
      <div class="card login-card">
        <div class="card-body">
          <div class="text-center mb-4">
            <img
              src="../assets/images/matriks-logo.png"
              class="login-logo"
              alt="Matriks"
            />
          </div>

          <h3 class="text-center mb-3">Şifremi Unuttum</h3>

          <p class="text-center text-muted mb-4">
            Şifre sıfırlama bağlantısını gönderebilmemiz için kayıtlı e-posta
            adresinizi giriniz.
          </p>

          <div
            id="successAlert"
            class="alert alert-success d-none text-center"
            role="alert"
          >
            <i class="fa-solid fa-circle-check me-2"></i>

            <span id="successMessage"></span>
          </div>

          <div id="backToLogin" class="text-center mt-4 d-none">
            <a href="login.html" class="forgot-password">
              <i class="fa-solid fa-arrow-left me-2"></i>
              Giriş Sayfasına Dön
            </a>
          </div>

          <form id="forgotForm" class="needs-validation" novalidate>
            <div class="mb-4">
              <label for="email" class="form-label">
                <i class="fa-solid fa-envelope me-2"></i>
                E-posta Adresi
              </label>

              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="ornek@matriks.com.tr"
                required
              />

              <div class="invalid-feedback">
                Geçerli bir e-posta adresi giriniz.
              </div>
            </div>

            <button type="submit" class="btn login-btn w-100">
              <i class="fa-solid fa-paper-plane me-2"></i>

              Şifre Sıfırlama Linki Gönder
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/forgot-password.js"></script>
  </body>
</html>
